# Run a repro from a GitHub thread against the game, and post the report back.
# Called by repro-issue.yml and repro-pr.yml; see docs/WORKFLOW.md.
#
# Two jobs, because a repro is arbitrary code:
#   run   takes the script out of the thread, builds, and runs it in the linux/
#         container with no network. It has no secrets and a read-only token.
#   post  holds the token that can comment. It only reads what run uploaded,
#         as text, and executes none of it.

name: repro (reusable)

on:
  workflow_call:
    inputs:
      repo:
        description: owner/name of the game repo
        type: string
        required: true
      thread:
        description: the issue or pull request to take the repro from, and to post to
        type: number
        required: true
      args:
        description: what to run against, as repro.js arguments (refs made by the setup step)
        type: string
        required: true
      setup:
        description: shell run in the game clone, on the host, before the run (fetches, branches)
        type: string
        default: ''
      runs:
        type: number
        default: 1
      as_of:
        description: ignore posts after this ISO time, and refuse a script edited since (default the start of the run)
        type: string
        default: ''

permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Take the repro out of the thread
        id: extract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.repo }}
          THREAD: ${{ inputs.thread }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          mkdir -p out
          as_of="${AS_OF:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          if node issue.js "$REPO#$THREAD" --as-of "$as_of" --out out/repro.js --json > out/source.json 2> out/extract.err; then
            cat out/source.json
          else
            cat out/extract.err
            rm -f out/source.json
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone the game
        if: steps.extract.outputs.failed != 'true'
        env:
          REPO: ${{ inputs.repo }}
          SETUP: ${{ inputs.setup }}
        run: |
          # Bare, so every branch is a local ref the runner can resolve offline.
          # Full, because the container cannot fetch missing objects later.
          git clone --quiet --bare "https://github.com/$REPO.git" game
          cd game && bash -euo pipefail -c "$SETUP"

      - name: Fetch gm8-builder and the template
        if: steps.extract.outputs.failed != 'true'
        run: |
          node -e "require('./lib/gm8builder.js').resolveBuilder().catch((e) => { console.error(e.message); process.exit(1); })"
          # The official release supplies the GM8 runner and its DLL, so no
          # Game Maker install goes anywhere near CI (README.md).
          curl -sSfL -o release.zip "https://www.ganggarrison.com/download.php?file=1"
          unzip -q -o release.zip "Gang Garrison 2.exe" -d template
          echo "7eb15834a390278181fa2b5f1040074002cdeb4eb28f92057b05d79002d9d645  template/Gang Garrison 2.exe" | sha256sum -c -
          rm release.zip

      - uses: docker/setup-buildx-action@v3
        if: steps.extract.outputs.failed != 'true'
      - uses: docker/build-push-action@v6
        if: steps.extract.outputs.failed != 'true'
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: linux
          tags: gg2-test
          load: true
          cache-from: type=gha,scope=gg2-test
          cache-to: type=gha,mode=max,scope=gg2-test

      - name: Run
        if: steps.extract.outputs.failed != 'true'
        env:
          ARGS: ${{ inputs.args }}
          RUNS: ${{ inputs.runs }}
        run: |
          set +e
          # shellcheck disable=SC2086 # ARGS is a word list by design
          docker run --rm --init --network none \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --memory 12g --pids-limit 4096 \
            -v "$PWD":/work -v "$PWD/game":/Gang-Garrison-2:ro \
            -v "$PWD/template/Gang Garrison 2.exe":/template.exe:ro -e GM8_TEMPLATE=/template.exe \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            gg2-test timeout 40m node repro.js out/repro.js $ARGS --runs "$RUNS" --out out/results
          echo "$?" > out/exit-code

      - name: Package what the post job reads
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AS_OF: ${{ steps.extract.outputs.as_of }}
        run: |
          mkdir -p out
          # Logs and the report only: a build has the bridge in it and never
          # leaves the runner (README.md, "The bridge").
          find out -name '*.exe' -delete
          node -e '
            const fs = require("fs");
            const read = (f) => { try { return fs.readFileSync(f, "utf8").trim(); } catch (e) { return undefined; } };
            const code = read("out/exit-code");
            fs.writeFileSync("out/meta.json", JSON.stringify({
              runUrl: process.env.RUN_URL,
              asOf: process.env.AS_OF,
              exitCode: code === undefined ? undefined : Number(code),
              extractError: read("out/extract.err"),
            }, null, 2));'
          cat out/meta.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro
          path: out/
          if-no-files-found: error

  post:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          name: repro
          path: run
      - name: Compose the comment
        run: node ci/comment.js run > comment.md && cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post it
        env:
          GH_TOKEN: ${{ secrets.REPRO_BOT_TOKEN }}
          REPO: ${{ inputs.repo }}
          THREAD: ${{ inputs.thread }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No REPRO_BOT_TOKEN secret, so the report is only in this run's summary."
            exit 0
          fi
          gh issue comment "$THREAD" --repo "$REPO" --body-file comment.md
